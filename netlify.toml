[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/insights"
  to = "/.netlify/functions/insights"
  status = 200

[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/download-singlefile"
  to = "/index.html"
  status = 200
  force = true
