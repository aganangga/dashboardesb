[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/omni/visits"
  to = "/.netlify/functions/omni-visits"
  status = 200

[[redirects]]
  from = "/api/insights"
  to = "/.netlify/functions/insights"
  status = 200

[build]
  command = "npm install --no-audit --no-fund && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/download-singlefile"
  to = "/index.html"
  status = 200
  force = true

[functions."sync-google-sheet"]
  schedule = "0 */6 * * *"

[[redirects]]
  from = "/api/worksheets"
  to = "/.netlify/functions/worksheets"
  status = 200

[[redirects]]
  from = "/api/team-assignments"
  to = "/.netlify/functions/team-assignments"
  status = 200
